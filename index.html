<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色とデジタル表現</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <nav class="tabs" role="tablist" aria-label="教材の切り替え">
    <button class="tab" role="tab" type="button" data-tab="mix" aria-selected="true">混色カード</button>
    <button class="tab" role="tab" type="button" data-tab="pixel" aria-selected="false">ピクセル拡大</button>
    <button class="tab" role="tab" type="button" data-tab="channels" aria-selected="false">色の分解</button>
  </nav>
</header>

<div class="image-bar" id="imageBar" hidden>
  <div class="image-meta">
    <span class="image-label">使用中の画像</span>
    <strong id="imageName">サンプル画像</strong>
    <span id="imageSize" class="muted"></span>
  </div>
  <div class="image-actions">
    <label class="btn btn-primary">画像を選ぶ<input type="file" id="fileInput" accept="image/*" hidden></label>
    <button class="btn" id="sampleBtn" type="button">サンプル画像</button>
  </div>
</div>

<main>
  <section class="panel active" id="panel-mix" role="tabpanel">
    <div class="toolbar">
      <div class="seg" id="mixMode" role="group" aria-label="モード">
        <button type="button" data-mode="rgb" aria-pressed="true">光の三原色（RGB）</button>
        <button type="button" data-mode="cmy" aria-pressed="false">色の三原色（CMY）</button>
      </div>
      <button type="button" class="btn" id="mixReset">配置をもどす</button>
    </div>
    <div class="workspace">
      <div class="stage" id="mixStage" aria-label="カードを置く場所"></div>
      <aside class="side">
        <div class="box" id="mixReadout"></div>
        <div class="box" id="mixOptions"></div>
      </aside>
    </div>
  </section>
  <section class="panel" id="panel-pixel" role="tabpanel">
    <div class="toolbar">
      <div class="btn-group">
        <button class="btn btn-icon" id="pxZoomOut" type="button" title="縮小" aria-label="縮小">－</button>
        <span class="zoom-label" id="pxZoomLabel">×1</span>
        <button class="btn btn-icon" id="pxZoomIn" type="button" title="拡大" aria-label="拡大">＋</button>
        <button class="btn" id="pxFit" type="button">全体を表示</button>
        <button class="btn" id="pxOne" type="button">等倍</button>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="pxGrid" checked> 格子線</label>
        <label><input type="checkbox" id="pxValues" checked> 数値を表示</label>
        <label><input type="checkbox" id="pxSub"> サブピクセル風</label>
      </div>
    </div>
    <div class="workspace">
      <div class="viewport" id="pxViewport"><canvas id="pxCanvas" tabindex="0" aria-label="画像の拡大表示"></canvas></div>
      <aside class="side">
        <div class="box" id="pxInfo"></div>
      </aside>
    </div>
  </section>
  <section class="panel" id="panel-channels" role="tabpanel">
    <div class="toolbar">
      <div class="seg" id="chMode" role="group" aria-label="分解の種類">
        <button type="button" data-mode="rgb" aria-pressed="true">RGB に分解</button>
        <button type="button" data-mode="cmy" aria-pressed="false">CMY に分解</button>
      </div>
      <div class="seg" id="chView" role="group" aria-label="表示方法">
        <button type="button" data-view="color" aria-pressed="true">色つき</button>
        <button type="button" data-view="gray" aria-pressed="false">濃淡（グレー）</button>
      </div>
    </div>
    <div class="ch-scroll">
      <div class="ch-grid">
        <figure class="ch-fig">
          <div class="ch-canvas"><canvas id="chOrig"></canvas></div>
          <figcaption><span class="ch-title">元の画像</span></figcaption>
        </figure>
        <figure class="ch-fig">
          <div class="ch-canvas"><canvas id="ch0"></canvas></div>
          <figcaption><span class="ch-title" id="chTitle0"></span><button type="button" class="link-btn" data-dl="0">PNG保存</button></figcaption>
        </figure>
        <figure class="ch-fig">
          <div class="ch-canvas"><canvas id="ch1"></canvas></div>
          <figcaption><span class="ch-title" id="chTitle1"></span><button type="button" class="link-btn" data-dl="1">PNG保存</button></figcaption>
        </figure>
        <figure class="ch-fig">
          <div class="ch-canvas"><canvas id="ch2"></canvas></div>
          <figcaption><span class="ch-title" id="chTitle2"></span><button type="button" class="link-btn" data-dl="2">PNG保存</button></figcaption>
        </figure>
      </div>

      <div class="comp">
        <div class="comp-head">
          <h2>重ね合わせ</h2>
          <div class="checks" id="chCompChecks"></div>
        </div>
        <div class="comp-body">
          <figure class="ch-fig comp-fig">
            <div class="ch-canvas"><canvas id="chCompCanvas"></canvas></div>
            <figcaption><span class="ch-title" id="chCompCap"></span><button type="button" class="link-btn" data-dl="comp">PNG保存</button></figcaption>
          </figure>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="drop-overlay" id="dropOverlay" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/common.js"></script>
<script src="js/mix.js"></script>
<script src="js/pixel.js"></script>
<script src="js/channels.js"></script>
</body>
</html>
